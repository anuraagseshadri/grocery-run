name: Gemini AI Coding Assistant

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  gemini-fix:
    if: >
      contains(github.event.issue.labels.*.name, 'gemini') ||
      contains(github.event.issue.title, '/gemini') ||
      contains(github.event.issue.body, '/gemini') ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/gemini'))

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Google Gen AI SDK
        run: npm install @google/genai

      - name: Run Gemini Code Generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body || github.event.comment.body }}
        run: |
          node -e '
          const { GoogleGenAI } = require("@google/genai");
          const fs = require("fs");
          const { execSync } = require("child_process");

          async function run() {
            if (!process.env.GEMINI_API_KEY) {
              throw new Error("GEMINI_API_KEY secret is missing in GitHub Repository Secrets.");
            }

            const ai = new GoogleGenAI({ apiKey: process.env.GEMINI_API_KEY });
            
            const allFiles = execSync("git ls-files").toString().split("\n").filter(Boolean);
            const issueText = `${process.env.ISSUE_TITLE} ${process.env.ISSUE_BODY}`.toLowerCase();

            const selectedFiles = new Set();

            // 1. First priority: Any filename explicitly mentioned in the issue
            for (const f of allFiles) {
              const filename = f.split("/").pop();
              if (filename && issueText.includes(filename.toLowerCase())) {
                selectedFiles.add(f);
              }
            }

            // 2. Second priority: Fill up to 3 total files with React components in src/
            for (const f of allFiles) {
              if (selectedFiles.size >= 3) break;
              if (f.startsWith("src/") && (f.endsWith(".tsx") || f.endsWith(".ts"))) {
                selectedFiles.add(f);
              }
            }

            let codebase = "";
            for (const file of Array.from(selectedFiles)) {
              if (fs.existsSync(file)) {
                codebase += `\n=== FILE: ${file} ===\n` + fs.readFileSync(file, "utf8");
              }
            }

            const prompt = `You are a professional full-stack React developer working on a grocery app.
            
            Task Title: ${process.env.ISSUE_TITLE}
            Task Description: ${process.env.ISSUE_BODY}

            Codebase Files:
            ${codebase}

            Instructions:
            Implement the requested UI, content, or bug fix.
            Return ONLY a valid JSON object mapping relative file paths to their full updated file contents.
            Do NOT include any text or markdown formatting outside the JSON object.
            Example:
            {
              "src/App.tsx": "updated content..."
            }`;

            console.log("Sending task to Gemini API (3-file mode)...");

            let attempts = 0;
            let response;
            while (attempts < 3) {
              try {
                attempts++;
                response = await ai.models.generateContent({
                  model: "gemini-3.6-flash",
                  contents: prompt
                });
                break;
              } catch (err) {
                if (err.message && err.message.includes("429") && attempts < 3) {
                  console.log(`Rate limit reached (429). Waiting 20 seconds before retry ${attempts}/3...`);
                  await new Promise(r => setTimeout(r, 20000));
                } else {
                  throw err;
                }
              }
            }

            let cleanJson = response.text.trim();
            if (cleanJson.includes("{")) {
              cleanJson = cleanJson.substring(cleanJson.indexOf("{"), cleanJson.lastIndexOf("}") + 1);
            }

            const updates = JSON.parse(cleanJson);
            for (const [filePath, fileContent] of Object.entries(updates)) {
              fs.writeFileSync(filePath, fileContent, "utf8");
              console.log("Successfully updated file:", filePath);
            }
          }

          run().catch(err => {
            console.error("Gemini Error:", err.message || err);
            process.exit(1);
          });
          '

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "feat: Gemini automated code update for Issue #${{ github.event.issue.number }}"
          title: "Gemini Fix: ${{ github.event.issue.title }}"
          body: "Automated code updates generated by Gemini based on Issue #${{ github.event.issue.number }}."
          branch: "gemini-update-${{ github.event.issue.number }}"
          delete-branch: true
