<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grocery Run | Smart Lists & Item Tracking</title>
    <meta name="description" content="Grocery Run is a smart, offline-capable grocery list web app that organizes your shopping by store and aisle while predicting household restock cycles." />

    <!-- PWA Core Manifest & Icons -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/android-192.png" />

    <!-- OS UI Integration -->
    <meta name="theme-color" content="#020617" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Google Site Verification -->
    <meta name="google-site-verification" content="PxODKtqu8D_UNG-jF5-9uduJm7jQEY6TEiJYoUGnEzQ" />

    <!-- Typography (Non-Render-Blocking for Fast FCP/LCP) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap"
      />
    </noscript>

    <!-- Prevent layout shift while Material Symbols font loads asynchronously -->
    <style>
      .material-symbols-outlined {
        display: inline-block;
        width: 1em;
        height: 1em;
        overflow: hidden;
        white-space: nowrap;
        direction: ltr;
      }
    </style>

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Grocery Run",
      "operatingSystem": "Web",
      "applicationCategory": "ShoppingApplication",
      "description": "A smart grocery list app that uses automated taxonomy to categorize items and reduce shopping friction.",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "CAD"
      }
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
