name: Gemini AI Coding Assistant

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  gemini-fix:
    # Runs when an issue has the 'gemini' label OR a comment contains '/gemini'
    if: >
      (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'gemini')) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/gemini'))

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Google Gen AI SDK
        run: npm install @google/genai

      - name: Run Gemini Code Generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body || github.event.comment.body }}
        run: |
          node -e '
          const { GoogleGenAI } = require("@google/genai");
          const fs = require("fs");
          const { execSync } = require("child_process");

          async function run() {
            const ai = new GoogleGenAI({ apiKey: process.env.GEMINI_API_KEY });
            
            // Gather project .tsx and .ts files
            const files = execSync("git ls-files").toString().split("\n")
              .filter(f => f.endsWith(".tsx") || f.endsWith(".ts") || f.endsWith(".js") || f.endsWith(".json"));

            let codebase = "";
            for (const file of files.slice(0, 25)) {
              if (fs.existsSync(file)) {
                codebase += `\n=== FILE: ${file} ===\n` + fs.readFileSync(file, "utf8");
              }
            }

            const prompt = `You are a professional full-stack React developer working on a grocery app.
            
            Task Title: ${process.env.ISSUE_TITLE}
            Task Description: ${process.env.ISSUE_BODY}

            Codebase Files:
            ${codebase}

            Instructions:
            Implement the requested UI, content, or bug fix.
            Return ONLY a JSON object mapping relative file paths to their full updated file contents.
            Do NOT include markdown formatting or extra text outside the JSON object.
            Example:
            {
              "src/components/Header.tsx": "updated content..."
            }`;

            const response = await ai.models.generateContent({
              model: "gemini-2.5-flash",
              contents: prompt
            });

            let cleanJson = response.text.trim();
            if (cleanJson.startsWith("```json")) cleanJson = cleanJson.replace(/^```json/, "").replace(/```$/, "").trim();
            if (cleanJson.startsWith("```")) cleanJson = cleanJson.replace(/^```/, "").replace(/```$/, "").trim();

            const updates = JSON.parse(cleanJson);
            for (const [filePath, fileContent] of Object.entries(updates)) {
              fs.writeFileSync(filePath, fileContent, "utf8");
              console.log("Updated file:", filePath);
            }
          }

          run().catch(err => {
            console.error("Gemini failed:", err);
            process.exit(1);
          });
          '

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "feat: Gemini automated code update for Issue #${{ github.event.issue.number }}"
          title: "Gemini Fix: ${{ github.event.issue.title }}"
          body: "Automated code updates generated by Gemini based on Issue #${{ github.event.issue.number }}."
          branch: "gemini-update-${{ github.event.issue.number }}"
          delete-branch: true
